<!DOCTYPE html>
<html>
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <style>

        body {
            font-family: "Poppins", sans-serif;
            height: 100vh;
            margin: 0;
        }
    </style>
</head>

<body>
    <table style='width: 100%;height:100%; background-color: #f6f7fb;'>
        <tbody>
            <tr>
                <td align='center'>
                    <table style='background-color: #f6f7fb; width: 100%'>
                        <tbody>
                            <tr>
                                <td align='center'>
                                    <table style='width: 600px; background: #fff; border-radius: 35px;padding-block-end: 2rem;padding-block-start: 3rem;'>
                                        <tbody>
                                            <tr>
                                                <td style='padding: 30px;padding-block-start: 0' align=''>
                                                    <table style='width: 600px; margin: 0 auto;'>
                                                        <tbody>
                                                            <tr>
                                                                <td align='center' style='text-align:center;padding-block-end:20px;'><a href="@baseurl" target="_blank"><img src='@mainlogo' alt='' width="200"></a></td>
                                                            </tr>
                                                        </tbody>
                                                    </table>
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style='padding: 30px;padding-block-start: 0;padding-block-end: 0' align=''>
                                                    <table>
                                                        <tbody>
                                                            <tr>
                                                                <td style='padding: 30px; border: 1px solid #dfe3f1; border-radius: 20px; background-color: #f6f7fb; '>
                                                                    <h4 style="margin-block-start:0;">Hi, @FirstName @LastName</h4>
                                                                    <table>
                                                                        <tbody>
                                                                            <tr>
                                                                                <td width='100%' style='margin-bottom: 30px;padding-bottom:12px;'>
                                                                                    <p style='margin:0;color: #777777;font-size:14px;line-height: 28px;'>
                                                                                        Your account has been created successfully. Welcome to Capital Brain & Spine!
                                                                                    </p>
                                                                                </td>
                                                                            </tr>
                                                                        </tbody>
                                                                    </table>
                                                                    <table>
                                                                        <tbody>
                                                                            <tr>
                                                                                <td width='100%' style='margin-bottom: 30px;padding-top:12px;padding-bottom:12px;'>
                                                                                    <p style='margin-bottom: 0px;'>Click here to login or reset your password using Forgot password link on the Login page.</p>
                                                                                    <p style='margin-bottom: 2px;'> Username:<b> @Username</b></p>
                                                                                </td>
                                                                            </tr>
                                                                            <tr>
                                                                                <td style='padding: 10px; text-decoration: none; background-color: #00bcd4; color: #fff; display: inline-block; border-radius: 8px; margin-bottom: 0px'>
                                                                                    <a style='text-decoration: none; text-transform: uppercase; background-color: #00bcd4; color: #fff; display: inline-block; border-radius: 8px;' href='@baseurl'>Click to login</a>
                                                                                </td>
                                                                            </tr>
                                                                    </table>
                                                                </td>
                                                            </tr>
                                                        </tbody>
                                                    </table>
                                                    <table style='width: 650px; margin: 0 auto; margin-top: 30px'>
                                                        <tbody>
                                                            <tr style='text-align: center'>
                                                                <td>
                                                                    <p style='color: #999; margin-bottom: 0'>Capital Brain & Spine.</p>
                                                                </td>
                                                            </tr>
                                                        </tbody>
                                                    </table>
                                                </td>
                                            </tr>

                                        </tbody>
                                    </table>

                                </td>
                            </tr>
                        </tbody>
                    </table>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
